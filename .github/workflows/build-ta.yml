name: build-target-allocator

on:
  push:
    branches:
      - ta-identity-hashing
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build target allocator binary
        run: make targetallocator ARCH=amd64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: cmd/otel-allocator
          platforms: linux/amd64
          push: true
          tags: ghcr.io/yonatan-ess/target-allocator:0.156.0-identity-hash
